services:
  db:
    container_name: task_manager_db
    image: mysql:8.4
    environment:
      MYSQL_NATIVE_PASSWORD: "true"
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    container_name: task_manager_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ENV: "${ENV:-dev}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - app_network
    entrypoint: [".docker/entrypoint.sh"]

  frontend:
    container_name: task_manager_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      ENV: "${ENV:-dev}"
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    entrypoint: [".docker/entrypoint.sh"]

networks:
  app_network:
    driver: bridge
