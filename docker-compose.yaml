services:
  db:
    container_name: task_manager_backend_db
    image: mysql:8.4
    platform: linux/amd64
    environment:
      MYSQL_NATIVE_PASSWORD: true
    env_file: backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
  backend:
    container_name: task_manager_backend
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    platform: linux/amd64
    env_file: backend/.env
    networks:
      - app_network
    depends_on:
      - db
    ports:
      - "8000:8000"
    entrypoint: [".docker/entrypoint.dev.sh"]

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
