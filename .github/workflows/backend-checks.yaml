name: Lint, Type Checking and Tests for Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yaml"

jobs:
  checks:
    runs-on: ubuntu-22.04
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: task_manager
          MYSQL_USER: mysql
          MYSQL_PORT: 3306
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: root
        ports: ["3306:3306"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "./backend/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"

      - name: Install the project
        working-directory: ./backend
        run: uv sync --locked --all-extras --dev

      - name: Run linter
        working-directory: ./backend
        run: make lint

      - name: Run type checker
        working-directory: ./backend
        run: make typecheck

      - name: Run migrations
        working-directory: ./backend
        run: make migrate
        env:
          MYSQL_DATABASE: task_manager
          MYSQL_USER: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: root
          DEBUG: true
          SECRET_KEY: secret


      - name: Run tests with coverage
        working-directory: ./backend
        run: make test
        env:
          MYSQL_DATABASE: task_manager
          MYSQL_USER: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_ROOT_PASSWORD: root
          MYSQL_PASSWORD: root
          DEBUG: true
          SECRET_KEY: secret
