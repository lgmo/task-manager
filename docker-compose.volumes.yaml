services:
  dbvol:
    container_name: task_manager_db_with_volume
    image: mysql:8.4
    environment:
      MYSQL_NATIVE_PASSWORD: "true"
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:
